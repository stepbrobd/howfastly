[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.dependencies]
anyhow                   = "1"
clap                     = { version = "4", features = ["derive", "env"] }
common                   = { package = "howfastly-common", path = "crates/howfastly-common", version = "2026.708.0" }
console_error_panic_hook = "0.1"
fastly                   = "0.13"
gloo-timers              = { version = "0.4", features = ["futures"] }
include_dir              = "0.7"
js-sys                   = "0.3"
leptos                   = { version = "0.8", features = ["csr"] }
proptest                 = "1"
reqwest                  = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "http3"] }
serde                    = { version = "1", features = ["derive"] }
serde_json               = "1"
tokio                    = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wasm-bindgen             = "=0.2.121"
wasm-bindgen-futures     = "0.4"

[workspace.dependencies.web-sys]
features = ["Headers", "Performance", "ProgressEvent", "ReadableStream", "ReadableStreamDefaultReader", "RequestInit", "Response", "Storage", "Window", "XmlHttpRequest", "XmlHttpRequestEventTarget", "XmlHttpRequestUpload"]
version  = "0.3"
