[package]
name    = "cli"
edition = "2024"
version = "0.1.0"

[[bin]]
name = "howfastly"
path = "src/main.rs"

[dependencies]
anyhow     = "1"
clap       = { version = "4", features = ["derive", "env"] }
common     = { path = "../common" }
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio      = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
