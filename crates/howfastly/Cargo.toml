[package]
name        = "howfastly"
description = "measure your connection speed to the fastly network"

edition.workspace    = true
license.workspace    = true
readme.workspace     = true
repository.workspace = true
version.workspace    = true

categories = ["command-line-utilities", "network-programming"]
keywords   = ["bandwidth", "fastly", "network", "speedtest"]

[lib]
name = "howfastly"
path = "src/lib.rs"

[[bin]]
name              = "howfastly"
path              = "src/main.rs"
required-features = ["cli"]

# none of these build for wasm32, keep them optional so a consumer can
# take this crate without dragging the binary's deps along
[features]
default = ["cli"]
cli     = ["dep:anyhow", "dep:clap", "dep:reqwest", "dep:serde_json", "dep:tokio"]

[dependencies]
anyhow     = { workspace = true, optional = true }
clap       = { workspace = true, optional = true }
reqwest    = { workspace = true, optional = true }
serde      = { workspace = true }
serde_json = { workspace = true, optional = true }
tokio      = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace   = true
serde_json.workspace = true
