[package]
name    = "web"
edition = "2024"
version = "0.1.0"

[dependencies]
common                   = { path = "../common" }
console_error_panic_hook = "0.1"
gloo-timers              = { version = "0.3", features = ["futures"] }
js-sys                   = "0.3"
leptos                   = { version = "0.8", features = ["csr"] }
serde_json               = "1"
wasm-bindgen             = "=0.2.121"
wasm-bindgen-futures     = "0.4"

[dependencies.web-sys]
features = ["Headers", "Performance", "ReadableStream", "ReadableStreamDefaultReader", "RequestInit", "Response", "Window"]
version  = "0.3"
