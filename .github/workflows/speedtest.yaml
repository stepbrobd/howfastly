name: Speedtest

on:
  pull_request:
    paths: [action.yaml, .github/workflows/speedtest.yaml]
  workflow_dispatch:

permissions: {}

jobs:
  Speedtest:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Speedtest
        id: speedtest
        uses: ./
      - name: Outputs
        env:
          DOWNLOAD: ${{ steps.speedtest.outputs.download }}
          UPLOAD: ${{ steps.speedtest.outputs.upload }}
          LATENCY: ${{ steps.speedtest.outputs.latency }}
          POP: ${{ steps.speedtest.outputs.pop }}
          JSON: ${{ steps.speedtest.outputs.json }}
          RESULTS: ${{ steps.speedtest.outputs.results }}
        run: |
          set -euo pipefail

          test -n "${DOWNLOAD}"
          test -n "${UPLOAD}"
          test -n "${LATENCY}"
          test -n "${POP}"
          test -s "${RESULTS}"
          jq -e . <<< "${JSON}" > /dev/null
