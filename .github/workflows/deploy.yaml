name: Deploy

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Service version to deploy into
        default: ""

permissions:
  contents: read

jobs:
  Deploy:
    # a green ci on master has pushed the package to the cache
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/nixos/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          extra_nix_config: |
            trusted-public-keys = cache.ysun.co-1:WxPYwT5g3kt9XhUhHPpNLZKI9HIOsVVAuqSHpok8Qt4= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://cache.ysun.co https://cache.nixos.org/
      - name: Build
        # download what ci built, never a second build of the same derivation
        run: nix build -L --max-jobs 0 .#crates.howfastly-compute
      - name: Deploy
        if: github.ref == 'refs/heads/master'
        env:
          FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # without a version the active one is cloned, a tofu draft must be named
          args=(--non-interactive --no-default-domain --status-check-off)
          if [ -n "${VERSION}" ]; then
            args+=(--version="${VERSION}")
          fi
          nix shell --inputs-from . nixpkgs#fastly --command \
            fastly compute pack --wasm-binary result/bin/howfastly-compute.wasm
          nix shell --inputs-from . nixpkgs#fastly --command \
            fastly compute deploy "${args[@]}"
